<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Winter 2027 Schedule Planner (MBA + SWELL)</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1b2430; --muted:#5d6b7c; --line:#dde2e8;
  --accent:#1f5f8b; --accent-soft:#e3eff7; --warn:#b3261e; --warn-soft:#fdeceb; --ok:#1d6b45; --ok-soft:#e5f4ec;
  --hl:#fff6d6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161c; --panel:#1a2029; --ink:#e7ebf0; --muted:#9aa7b6; --line:#2c3541;
    --accent:#6fb2e0; --accent-soft:#1c2f3e; --warn:#ff8a80; --warn-soft:#3a1f1d; --ok:#79d3a3; --ok-soft:#1b3326; --hl:#3a3418;
  }
}
:root[data-theme="dark"]{
  --bg:#12161c; --panel:#1a2029; --ink:#e7ebf0; --muted:#9aa7b6; --line:#2c3541;
  --accent:#6fb2e0; --accent-soft:#1c2f3e; --warn:#ff8a80; --warn-soft:#3a1f1d; --ok:#79d3a3; --ok-soft:#1b3326; --hl:#3a3418;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif}
header{padding:20px 20px 8px;max-width:1200px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px;font-weight:650}
header p{margin:0;color:var(--muted);max-width:75ch}
.wrap{max-width:1200px;margin:0 auto;padding:12px 20px 40px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tab{background:none;border:0;padding:10px 14px;font:inherit;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab[data-tab="fill"][aria-selected="true"]{border-bottom-color:var(--ok)}
.tab:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:12px;text-align:center}
.badge.sw{background:var(--ok-soft);color:var(--ok)}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
input[type=search],select{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit}
input[type=search]{min-width:220px;flex:1;max-width:340px}
.chk{display:flex;gap:6px;align-items:center;color:var(--muted)}
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:12px}
table{border-collapse:collapse;width:100%;min-width:860px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:600;background:var(--panel);position:sticky;top:0;cursor:pointer;white-space:nowrap;user-select:none}
tr:last-child td{border-bottom:0}
tr.sel td{background:var(--accent-soft)}
tr.clash td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.code{font-weight:600;white-space:nowrap}
.sub{color:var(--muted);font-size:13px}
.time{white-space:nowrap}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:10px;border:1px solid var(--line);color:var(--muted);margin:2px 4px 0 0}
.tag.warn{color:var(--warn);border-color:var(--warn)}
button.add{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer;white-space:nowrap}
button.add[aria-pressed="true"]{background:var(--accent);color:var(--panel)}
button.add.sw{border-color:var(--ok);color:var(--ok)}
button.add.sw[aria-pressed="true"]{background:var(--ok);color:var(--panel)}
.ovl{border:0;background:none;color:var(--warn);cursor:pointer;font:inherit;padding:0;text-decoration:underline}
.ovl.go{color:var(--ok)}
.none{color:var(--muted)}
.group{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:12px;overflow:hidden}
.group h3{margin:0;padding:10px 14px;font-size:15px;background:var(--accent-soft);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.group.sw h3{background:var(--ok-soft)}
.group h3 span{color:var(--muted);font-weight:400;font-size:13px}
.group ul{list-style:none;margin:0;padding:0}
.group li{display:flex;gap:12px;padding:8px 14px;border-top:1px solid var(--line);align-items:center;flex-wrap:wrap}
.group li.sel{background:var(--ok-soft)}
.group li .nm{flex:1;min-width:220px}
.acthd{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--ink);cursor:pointer;text-align:left}
.acthd .sub{margin-left:6px;font-weight:400}
.daytitle{margin:18px 0 8px;font-size:17px}
.note{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;color:var(--muted);margin-bottom:12px}
.note.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--ink)}
.note.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.note b{color:var(--ink)}
.grid{display:grid;grid-template-columns:56px repeat(5,minmax(120px,1fr));min-width:720px;background:var(--panel);border:1px solid var(--line);border-radius:8px;position:relative}
.gwrap{overflow-x:auto}
.gh{padding:8px;text-align:center;font-weight:600;border-bottom:1px solid var(--line);border-left:1px solid var(--line);font-size:13px}
.gh:first-child{border-left:0}
.col{position:relative;border-left:1px solid var(--line)}
.hr{position:absolute;left:0;right:0;border-top:1px dashed var(--line);font-size:11px;color:var(--muted)}
.timecol{position:relative}
.timecol .hr{border:0;padding-left:6px;transform:translateY(-7px)}
.ev{position:absolute;border-radius:5px;padding:3px 5px;font-size:12px;line-height:1.25;overflow:hidden;background:var(--accent-soft);border:1px solid var(--accent);color:var(--ink)}
.ev.sw{background:var(--ok-soft);border-color:var(--ok)}
.ev.clash{background:var(--warn-soft);border-color:var(--warn)}
.ev b{display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin:8px 0}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
tr.detail td{background:var(--bg);padding:0}
.dbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;padding:12px 14px;border-left:3px solid var(--warn)}
.dcol h4{margin:0 0 6px;font-size:14px}
ul.mini{list-style:none;margin:0;padding:0}
ul.mini li{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line);flex-wrap:wrap}
ul.mini li:first-child{border-top:0}
ul.mini .nm{flex:1;min-width:160px}
.dfoot{grid-column:1/-1;display:flex;gap:16px}
.tag.ok{color:var(--ok);border-color:var(--ok)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.clear{margin-left:auto;border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit}
.gaps{display:grid;gap:6px;margin-top:10px}
.gaprow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.gaprow .d{width:40px;font-weight:600;color:var(--ink)}
.chip{border:1px solid var(--ok);background:transparent;color:var(--ok);border-radius:999px;padding:2px 10px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ok);color:var(--panel)}
.fl{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px}
</style>
</head>

// Side-by-side lanes for events that share time on the same day
function layout(evs){
  evs.sort((a,b)=>a.s-b.s||a.e-b.e);
  const out=[];let cluster=[],cEnd=-1;
  const flush=()=>{
    if(!cluster.length)return;
    const lanes=[];
    cluster.forEach(ev=>{let l=lanes.findIndex(end=>end<=ev.s);if(l<0){l=lanes.length;lanes.push(0)}lanes[l]=ev.e;ev.lane=l});
    cluster.forEach(ev=>ev.n=lanes.length);
    out.push(...cluster);cluster=[];
  };
  evs.forEach(ev=>{
    if(cluster.length&&ev.s>=cEnd){flush();cEnd=-1}
    cluster.push(ev);cEnd=Math.max(cEnd,ev.e);
  });
  flush();return out;
}

  if(sw.some(x=>x.online))html+=`<div class="sub" style="margin-bottom:8px">Online SWELL sections have no set meeting time, so they are listed below but not drawn on the week.</div>`;
  const th=`<th style="cursor:default">Code</th><th style="cursor:default">Class</th><th style="cursor:default">Professor</th><th style="cursor:default">Time</th><th style="cursor:default"></th>`;
  const row=c=>`<tr class="${cl.has(c.id)?"clash":""}"><td class="code">${esc(c.code)}</td><td>${esc(c.name)}<div class="sub">${esc(c.kind==="swell"?swWhere(c):c.room)}</div>${c.blk?`<span class="tag">${esc(blkTxt(c.blk))}</span>`:""}${coreTag(c)}</td><td>${esc(c.prof||"TBA")}</td><td class="time">${esc(timeStr(c))}</td><td><button class="add ${c.kind==="swell"?"sw":""}" data-add="${c.id}" aria-pressed="true">Remove</button></td></tr>`;
  if(mba.length)html+=`<div class="tablewrap"><table><thead><tr>${th}</tr></thead><tbody>${sorted(mba).map(row).join("")}</tbody></table></div>`;
  if(sw.length)html+=`<h2 class="daytitle">SWELL</h2><div class="tablewrap"><table><thead><tr>${th}</tr></thead><tbody>${sorted(sw).map(row).join("")}</tbody></table></div>`;
  return html;
}

// ---------- SWELL: fill free time ----------
const swWhere=x=>x.room==="TBA"?"Off campus (location TBA)":x.room;
const DAY_S=420,DAY_E=1080; // open windows are looked for between 7am and 6pm
function gapsFor(d){
  const busy=selItems().filter(x=>!x.online&&x.days.includes(d)).map(x=>[x.s,x.e]).sort((a,b)=>a[0]-b[0]);
  const out=[];let cur=DAY_S;
  busy.forEach(([s,e])=>{const end=Math.min(s,DAY_E);if(end-cur>=50)out.push([cur,end]);cur=Math.max(cur,e)});
  if(DAY_E-cur>=50)out.push([cur,DAY_E]);
  return out;
}
function swBase(){
  const t=swQ.toLowerCase();
  return S.filter(x=>{
    if(t&&!(x.code+" "+x.name+" "+x.prof+" "+x.room).toLowerCase().includes(t))return false;
    if(x.online){
      if(swAfter!==""||swBefore!=="")return false;
      if(!(swDay==="online"||(swOnline&&swDay==="")))return false;
    }else{
      if(swDay==="online")return false;
      if(swDay&&!x.days.includes(swDay))return false;
      if(swAfter!==""&&x.s<swAfter)return false;
      if(swBefore!==""&&x.e>swBefore)return false;
    }
    if(swBlock&&(swBlock==="full"?x.blk!=="":x.blk!==swBlock))return false;
    return true;
  });
}
const timeOpts=(val,anyLabel)=>{
  const set=new Set();for(let m=360;m<=1320;m+=30)set.add(m);if(val!=="")set.add(val);
  return `<option value="">${anyLabel}</option>`+[...set].sort((a,b)=>a-b).map(m=>`<option value="${m}" ${val===m?"selected":""}>${fmt(m)}</option>`).join("");
};
const isOpenAct=k=>k in actState?actState[k]:autoOpen;

function swRow(x){
  const on=sel.has(x.id);
  const cf=conflictsOf(x);
  const m=mbaSame(x);
  const shownM=m.slice(0,3).map(c=>esc(c.code+" "+c.name)).join("; ");
  const moreM=m.length>3?` <span title="${esc(m.slice(3).map(c=>c.code+" "+c.name).join("; "))}">+${m.length-3} more: ${esc(m.slice(3).map(c=>c.code).join(", "))}</span>`:"";
  const mbaNote=x.online?"":m.length?`<div class="sub">Same time as MBA: ${shownM}${moreM}</div>`:`<div class="sub">No MBA class meets at this time</div>`;
  const seats=x.open<=0?`<span class="tag warn">Full</span>`:`${x.open}/${x.seats} seats`;
  return `<li class="${on?"sel":""}"><span class="code" style="min-width:48px">${esc(x.sec)}</span>
    <span class="nm">${esc(timeStr(x))}<div class="sub">${esc(x.online?"Online":swWhere(x))} · ${esc(x.prof||"Instructor TBA")} · ${seats}</div>${mbaNote}
    ${coreTag(x)}${x.blk?`<span class="tag">${esc(blkTxt(x.blk))}</span>`:""}${cf.length?`<span class="tag warn">Conflicts with ${esc(cf.map(o=>o.code).join(", "))}</span>`:""}</span>
    <button class="add sw" data-add="${x.id}" aria-pressed="${on}">${on?"Added":"Add"}</button></li>`;
}

function fillView(){
  const items=selItems();
  const mba=items.filter(x=>x.kind==="mba"),sw=items.filter(x=>x.kind==="swell");
  const pairs=pairsOf(items);
  let html="";
  if(pairs.length)html+=conflictNote(pairs,"");
  if(!mba.length){
    html+=`<div class="note"><b>Add your MBA classes first.</b> This tab then shows only SWELL sections that fit around them. Nothing is blocked yet, so every section is listed.</div>`;
  }else{
    const rows=[..."MTWRF"].map(d=>{
      const g=gapsFor(d);
      return `<div class="gaprow"><span class="d">${DN[d]}</span>${g.length?g.map(([s,e])=>{const on=swDay===d&&swAfter===s&&swBefore===e;return `<button class="chip" data-gap="${d}|${s}|${e}" aria-pressed="${on}">${fmt(s)}–${fmt(e)}</button>`}).join(""):`<span class="sub">no open time</span>`}</div>`}).join("");
    html+=`<div class="note"><b>Open time in your week</b> (7am–6pm, 50 minutes or longer). Tap a window to list only the SWELL sections that fit inside it.<div class="gaps">${rows}</div></div>`;
  }
  const base=swBase();
  const fitting=base.filter(x=>sel.has(x.id)||fits(x));
  const hidden=base.length-fitting.length;
  const shown=swShowConf?base:fitting;
  autoOpen=shown.length<=30;
  const byAct={};
  shown.forEach(x=>(byAct[x.num]=byAct[x.num]||[]).push(x));
  const acts=Object.keys(byAct).sort((a,b)=>TITLES[a].localeCompare(TITLES[b]));
  const filt=swDay||swAfter!==""||swBefore!==""||swBlock||swQ||!swOnline||swShowConf;
  html+=`<div class="controls">
    <input type="search" id="swq" placeholder="Search activity, instructor, building" value="${esc(swQ)}" aria-label="Search SWELL activities">
    <label class="fl">Day <select id="swday"><option value="">Any</option>${[...DORDER].map(d=>`<option value="${d}" ${swDay===d?"selected":""}>${DN[d]}</option>`).join("")}<option value="online" ${swDay==="online"?"selected":""}>Online only</option></select></label>
    <label class="fl">From <select id="swafter">${timeOpts(swAfter,"Any")}</select></label>
    <label class="fl">Until <select id="swbefore">${timeOpts(swBefore,"Any")}</select></label>
    <label class="fl">Dates <select id="swblock"><option value="">Any</option><option value="full" ${swBlock==="full"?"selected":""}>Full semester</option><option value="1st" ${swBlock==="1st"?"selected":""}>1st block</option><option value="2nd" ${swBlock==="2nd"?"selected":""}>2nd block</option></select></label>
  </div>
  <div class="controls">
    <label class="chk"><input type="checkbox" id="swonline" ${swOnline?"checked":""}> Include online sections</label>
    <label class="chk"><input type="checkbox" id="swconf" ${swShowConf?"checked":""}> Also show sections that conflict${hidden&&!swShowConf?` (${hidden} hidden)`:""}</label>
    ${filt?`<button class="clear" style="margin-left:0" data-swreset="1">Clear filters</button>`:""}
    <span class="sub" style="margin-left:auto">${shown.length} section${shown.length===1?"":"s"} in ${acts.length} activit${acts.length===1?"y":"ies"}${sw.length?` · ${sw.length} added (${fmtCr(sw.length*0.5)} cr)`:""}</span>
  </div>`;
  if(!acts.length){
    html+=`<div class="note empty">No SWELL sections fit those filters. Try a wider time window${hidden?`, or turn on "Also show sections that conflict"`:""}.</div>`;
  }else{
    html+=acts.map(k=>{
      const g=byAct[k].sort((a,b)=>dayRank(a)-dayRank(b)||(a.online?0:a.s)-(b.online?0:b.s)||a.sec.localeCompare(b.sec));
      const o=isOpenAct(k),nAdd=g.filter(x=>sel.has(x.id)).length;
      return `<div class="group sw"><h3><button class="acthd" data-act="${k}" aria-expanded="${o}">${o?"▾":"▸"} ${esc(TITLES[k])}<span class="sub">SWELL ${k}</span></button><span>${nAdd?`${nAdd} added · `:""}${g.length} section${g.length>1?"s":""}</span></h3>${o?`<ul>${g.map(swRow).join("")}</ul>`:""}</div>`}).join("");
  }
  html+=`<div class="note"><b>Notes.</b> Every SWELL section is 0.5 credit. Semester runs Jan 6 – Apr 14, 2027; 1st block is Jan 6–Feb 24 and 2nd block is Feb 25–Apr 14, so a 1st-block and a 2nd-block section can share a time slot. MBA classes are treated as running the full semester. Buildings: RB Richards · SFH Smith Fieldhouse · WSC Wilkinson Student Center · IPF Indoor Practice Facility · RBF/NUF fields · TCF/TCB tennis · SFLD/GLFG golf. Scuba meets for a 6:00pm classroom hour, then a pool or dive session 8:00–9:50pm; it is shown here as one block. Seat counts are from Oct 9, 2026, so check MyMAP before you register.</div>`;
  return html;
}

function render(keepFocus){
  document.getElementById("cnt").textContent=sel.size;
  document.getElementById("cntsw").textContent=[...sel].filter(i=>i>=1000).length;
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.tab===tab));
  const v=document.getElementById("view");
  v.innerHTML=tab==="all"?allView():tab==="slots"?slotsView():tab==="fill"?fillView():mineView();
  if(keepFocus){const el=document.getElementById(tab==="fill"?"swq":"q");const len=tab==="fill"?swQ.length:q.length;if(el){el.focus();el.setSelectionRange(len,len)}}
}

const keepY=fn=>{const y=window.scrollY;fn();render();window.scrollTo(0,y)};
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-add],[data-sort],[data-ov],[data-focus],[data-clearfocus],[data-clearall],[data-clearsw],[data-gap],[data-act],[data-swreset]");
  if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;render();window.scrollTo(0,0)}
  else if(t.dataset.add!==undefined){const i=+t.dataset.add;keepY(()=>{sel.has(i)?sel.delete(i):sel.add(i);save()})}
  else if(t.dataset.sort){const k=t.dataset.sort;if(sortK===k)sortDir*=-1;else{sortK=k;sortDir=1}render()}
  else if(t.dataset.ov){const i=+t.dataset.ov;keepY(()=>{open.has(i)?open.delete(i):open.add(i)})}
  else if(t.dataset.focus){focusId=+t.dataset.focus;open.clear();render();window.scrollTo(0,0)}
  else if(t.dataset.clearfocus){focusId=null;render()}
  else if(t.dataset.clearall){sel.clear();save();render()}
  else if(t.dataset.clearsw){[...sel].filter(i=>i>=1000).forEach(i=>sel.delete(i));save();render()}
  else if(t.dataset.gap){const [d,s,en]=t.dataset.gap.split("|");
    if(swDay===d&&swAfter===+s&&swBefore===+en){swDay="";swAfter="";swBefore=""}else{swDay=d;swAfter=+s;swBefore=+en}render()}
  else if(t.dataset.act){const k=t.dataset.act;keepY(()=>{actState[k]=!isOpenAct(k)})}
  else if(t.dataset.swreset){swQ="";swDay="";swAfter="";swBefore="";swBlock="";swOnline=true;swShowConf=false;render()}
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){q=e.target.value;focusId=null;render(true)}
  if(e.target.id==="swq"){swQ=e.target.value;render(true)}
});
document.addEventListener("change",e=>{
  const id=e.target.id,v=e.target.value;
  if(id==="day"){dayF=v;focusId=null;render()}
  if(id==="full"){hideFull=e.target.checked;render()}
  if(id==="swday"){swDay=v;render()}
  if(id==="swafter"){swAfter=v===""?"":+v;render()}
  if(id==="swbefore"){swBefore=v===""?"":+v;render()}
  if(id==="swblock"){swBlock=v;render()}
  if(id==="swonline"){swOnline=e.target.checked;render()}
  if(id==="swconf"){swShowConf=e.target.checked;render()}
});
render();
</script>
</body>
</html>
